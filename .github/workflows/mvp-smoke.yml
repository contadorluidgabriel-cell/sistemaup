name: MVP Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check volume-engine.js
          node --check prescription-engine.js
          node --check execution-engine.js
          node --check exercise-history.js
          node --check training-experience.js
          node --check mvp-audit.js
          node --check mvp-ux-guard.js
          node --check app-experience.js
          node --check app-polish-extra.js
          node --check supabase-config.js
          node --check cloud-sync.js
          node --check sw.js

      - name: Validate required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f screens.css
          test -f app-experience.css
          test -f app-polish-extra.css
          test -f supabase-config.js
          test -f cloud-sync.js
          test -f cloud-sync.css
          test -f supabase/schema.sql
          test -f manifest.webmanifest
          test -f app-icon.svg
          test -f sw.js
          test -f netlify.toml

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Validate isolated cloud mode
        run: |
          grep -q "enabled:false" supabase-config.js
          grep -q "enable row level security" supabase/schema.sql
          grep -q "muscle_state" supabase/schema.sql
